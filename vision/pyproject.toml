[project]
name = "dispensing-metrology"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "python-multipart>=0.0.12",
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"

[tool.pyright]
venvPath = "."
venv = ".venv"

